---

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: Update the configuration
  ansible.builtin.template:
    src: etc_apt_apt.conf.d_10general.j2
    dest: /etc/apt/apt.conf.d/10general
    owner: root
    group: root
    mode: '0644'

# - name: Make sure the required packages are installed
#   ansible.builtin.apt:
#     name:
#       - python-apt
#       - python-pycurl
#       - unattended-upgrades

- name: Reset default APT sources
  ansible.builtin.shell: mv /etc/apt/sources.list /etc/apt/sources.list~0
  when: apt_sources_reset
  ignore_errors: true

- name: Add third keys
  ansible.builtin.apt_key:
    url: '{{ item.url }}'
  loop: "{{ apt_third_keys }}"

- name: Append additional sources
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    update_cache: true
  loop: "{{ apt_repositories }}"

- name: Upgrade system
  ansible.builtin.apt:
    upgrade: "{{ apt_upgrade }}"
  when: apt_upgrade == "safe" or apt_upgrade == "full" or apt_upgrade == "dist"

- name: Install build-essential packages
  ansible.builtin.apt:
    name: "{{ apt_build_packages }}"
  changed_when: false
  when: apt_build_packages_install

- name: Install default packages
  ansible.builtin.apt:
    name: "{{ apt_default_packages }}"
  when: apt_default_packages_install

- name: Install additional packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
